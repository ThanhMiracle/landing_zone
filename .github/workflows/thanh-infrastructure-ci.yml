name: Thanh Infrastructure CI

on:
  pull_request:
    branches:
      - master
    paths: &thanh_paths
      - ".github/actions/setup-iac/**"
      - ".github/workflows/thanh-infrastructure-*.yml"
      - ".github/dependabot.yml"
      - "environments/thanh/**"
      - "modules/**"
      - "stacks/**"
  push:
    branches:
      - master
    paths: *thanh_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thanh-infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TG_NON_INTERACTIVE: "true"
  TERRAGRUNT_USE_LOCAL_BACKEND: "true"
  TERRAFORM_VERSION: "1.14.4"
  TERRAGRUNT_VERSION: "1.1.1"

jobs:
  validate:
    name: Format and validate Thanh
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install IaC tools
        uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Show tool versions
        run: |
          terraform version
          terragrunt --version

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -diff -recursive modules
          terraform fmt -check -diff -recursive stacks
          terraform fmt -check -diff -recursive environments/thanh

      - name: Check Thanh Terragrunt formatting
        working-directory: environments/thanh
        run: terragrunt hcl fmt --check --diff

      - name: Validate enabled Thanh stacks
        working-directory: environments/thanh
        run: |
          terragrunt run \
            --source-update \
            --all \
            --parallelism 4 \
            --provider-cache \
            --provider-cache-dir "${RUNNER_TEMP}/terragrunt-provider-cache" \
            -- validate -no-color
