name: Thanh Infrastructure CD

on:
  push:
    branches:
      - master
    paths:
      - ".github/actions/setup-iac/**"
      - ".github/workflows/thanh-infrastructure-*.yml"
      - "environments/thanh/**"
      - "modules/**"
      - "stacks/**"
  workflow_dispatch:
    inputs:
      operation:
        description: Select whether to plan or deploy the Thanh environment
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: Type apply-thanh when operation is apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: thanh-infrastructure-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TG_NON_INTERACTIVE: "true"
  TERRAFORM_VERSION: "1.14.4"
  TERRAGRUNT_VERSION: "1.1.1"

jobs:
  plan:
    name: Plan Thanh
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: thanh-plan
    permissions:
      contents: read
      id-token: write

    outputs:
      plan_sha256: ${{ steps.plan_digest.outputs.sha256 }}

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_postgresql_admin_password: ${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}

    steps:
      - name: Validate deployment request
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Apply refused: Thanh deployments must run from master." >&2
            exit 1
          fi
          if [[ "${CONFIRM_APPLY}" != "apply-thanh" ]]; then
            echo "Apply refused: confirm_apply must exactly equal apply-thanh." >&2
            exit 1
          fi

      - name: Check required environment secrets
        run: |
          set -euo pipefail
          for variable_name in \
            ARM_CLIENT_ID \
            ARM_TENANT_ID \
            ARM_SUBSCRIPTION_ID \
            TF_VAR_postgresql_admin_password; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing thanh-plan environment secret for ${variable_name}." >&2
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install IaC tools
        uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show execution context
        run: |
          set -euo pipefail
          terraform version
          terragrunt --version
          az account show \
            --query '{subscription:id,tenant:tenantId,identity:user.name}' \
            --output table

      - name: Plan Thanh infrastructure
        id: plan
        working-directory: environments/thanh
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/thanh-plan"
          mkdir -p "${evidence_dir}"
          terragrunt run \
            --source-update \
            --all \
            --parallelism 4 \
            --provider-cache \
            --provider-cache-dir "${RUNNER_TEMP}/terragrunt-provider-cache" \
            -- plan \
            -input=false \
            -lock-timeout=10m \
            -no-color 2>&1 | tee "${evidence_dir}/plan.txt"

      - name: Record plan checksum
        id: plan_digest
        run: |
          set -euo pipefail
          plan_file="${RUNNER_TEMP}/thanh-plan/plan.txt"
          sha256sum "${plan_file}" | awk '{print $1}' > "${RUNNER_TEMP}/thanh-plan/plan.sha256"
          echo "sha256=$(cat "${RUNNER_TEMP}/thanh-plan/plan.sha256")" >> "${GITHUB_OUTPUT}"

      - name: Upload plan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thanh-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thanh-plan/
          if-no-files-found: warn
          retention-days: 30

      - name: Write plan summary
        if: always()
        env:
          REQUESTED_OPERATION: ${{ inputs.operation || 'plan' }}
        run: |
          {
            echo "## Thanh infrastructure plan"
            echo
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Requested operation: \`${REQUESTED_OPERATION}\`"
            echo "- Scope: \`environments/thanh\`"
            echo "- Plan SHA-256: \`${{ steps.plan_digest.outputs.sha256 }}\`"
            echo "- Evidence retention: 30 days"
          } >> "${GITHUB_STEP_SUMMARY}"

  apply:
    name: Apply Thanh
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: thanh
    permissions:
      contents: read
      id-token: write

    env:
      # ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_postgresql_admin_password: ${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}
      APPROVED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}

    steps:
      - name: Authorize deployment
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Apply refused: Thanh deployments must run from master." >&2
            exit 1
          fi
          if [[ "${CONFIRM_APPLY}" != "apply-thanh" ]]; then
            echo "Apply refused: confirm_apply must exactly equal apply-thanh." >&2
            exit 1
          fi

      - name: Check required environment secrets
        run: |
          set -euo pipefail
          for variable_name in \
            ARM_CLIENT_ID \
            ARM_TENANT_ID \
            ARM_SUBSCRIPTION_ID \
            TF_VAR_postgresql_admin_password; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing thanh environment secret for ${variable_name}." >&2
              exit 1
            fi
          done

      - name: Check out approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install IaC tools
        uses: ./.github/actions/setup-iac
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Re-plan approved commit
        working-directory: environments/thanh
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/thanh-apply"
          mkdir -p "${evidence_dir}"
          terragrunt run \
            --source-update \
            --all \
            --parallelism 4 \
            --provider-cache \
            --provider-cache-dir "${RUNNER_TEMP}/terragrunt-provider-cache" \
            -- plan \
            -input=false \
            -lock-timeout=10m \
            -no-color 2>&1 | tee "${evidence_dir}/replan.txt"
          replan_sha256="$(sha256sum "${evidence_dir}/replan.txt" | awk '{print $1}')"
          if [[ "${replan_sha256}" != "${APPROVED_PLAN_SHA256}" ]]; then
            echo "Re-plan checksum differs from the plan approved for this run." >&2
            echo "Approved: ${APPROVED_PLAN_SHA256}" >&2
            echo "Current:  ${replan_sha256}" >&2
            exit 1
          fi
          echo "Verified approved plan checksum: ${replan_sha256}"

      - name: Apply approved commit
        working-directory: environments/thanh
        run: |
          set -euo pipefail
          terragrunt run \
            --all \
            --parallelism 4 \
            --provider-cache \
            --provider-cache-dir "${RUNNER_TEMP}/terragrunt-provider-cache" \
            -- apply \
            -auto-approve \
            -input=false \
            -lock-timeout=10m \
            -no-color

      - name: Verify Thanh deployment
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/thanh-apply"
          mkdir -p "${evidence_dir}"
          resource_group="thanhproject-dev-rg"
          {
            az group show \
              --name "${resource_group}" \
              --query '{name:name,state:properties.provisioningState,location:location}' \
              --output table
            az aks show \
              --resource-group "${resource_group}" \
              --name thanhproject-dev-aks \
              --query '{name:name,state:provisioningState,version:kubernetesVersion}' \
              --output table
            az postgres flexible-server list \
              --resource-group "${resource_group}" \
              --query '[].{name:name,state:state,fqdn:fullyQualifiedDomainName}' \
              --output table
            az resource list \
              --resource-group "${resource_group}" \
              --query '[].{name:name,type:type,state:properties.provisioningState}' \
              --output table
          } | tee "${evidence_dir}/verification.txt"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thanh-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thanh-apply/
          if-no-files-found: warn
          retention-days: 30

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Thanh infrastructure apply"
            echo
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Scope: \`environments/thanh\`"
            echo "- Protected environment: \`thanh\`"
            echo "- Approved plan SHA-256: \`${APPROVED_PLAN_SHA256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
